name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan on Mondays

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for critical vulnerabilities
        run: |
          if npm audit --audit-level=critical 2>&1 | grep -q "critical"; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          echo "✅ No critical vulnerabilities"

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  electron-security:
    name: Electron Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for dangerous Electron configurations
        run: |
          echo "Checking for dangerous Electron security configurations..."
          
          # Check for nodeIntegration enabled
          if grep -r "nodeIntegration.*true" src/ --include="*.ts" --include="*.js"; then
            echo "❌ nodeIntegration is enabled - security risk!"
            exit 1
          fi
          
          # Check for contextIsolation disabled
          if grep -r "contextIsolation.*false" src/ --include="*.ts" --include="*.js"; then
            echo "❌ contextIsolation is disabled - security risk!"
            exit 1
          fi
          
          # Check for remote module usage
          if grep -r "require.*electron.*remote" src/ --include="*.ts" --include="*.js"; then
            echo "❌ Remote module usage detected - security risk!"
            exit 1
          fi
          
          echo "✅ Electron security checks passed"

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for CSP configuration
        run: |
          echo "Checking for Content Security Policy configuration..."
          
          # Check if CSP is configured
          if grep -r "Content-Security-Policy" src/ --include="*.ts" --include="*.js"; then
            echo "✅ Content Security Policy found"
          else
            echo "⚠️  Content Security Policy not found - consider adding CSP headers"
          fi
