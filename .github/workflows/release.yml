name: Release

# Ao criar uma tag vX.Y.Z: builda os instaladores em cada SO, anexa a um GitHub Release (rascunho)
# e publica o release no final. O app se atualiza a partir dele (electron-updater, provider github).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do app = tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec jest --ci
      - run: pnpm run build
      - name: Empacotar e anexar ao release
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura (opcional). Sem estes segredos o app sai sem assinatura.
          # No macOS o auto-update só funciona com app assinado e notarizado.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar o rascunho do release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
